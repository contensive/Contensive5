<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="layout" content="Login By Email New User OTP Form Layout">
    <meta name="layout-guid" content="{99C8FB3D-745E-4F3E-9994-3B521BDBEDDA}">
    <title>Login By Email New User OTP Form Layout</title>
</head>
<body>
<style>
    .form-control::placeholder {
        color: #bbb;
    }
</style>
<div class="container-fluid">
    <div class="card card-body col-sm-10 col-md-7 col-lg-6 m-auto rounded-3 shadow-sm py-4 px-4 mt-5">
        <div class="text-center mb-4 border-bottom pb-3">
            <h1 class="fs-3">Complete Your Registration</h1>
            <p class="text-muted">A one-time access code has been sent to your email. Enter your details and the code below to create your account.</p>
        </div>
        <div id="newUserOtpForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="loginByEmailFirstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="loginByEmailFirstName" name="firstname" aria-label="First name">
                </div>
                <div class="col-md-6">
                    <label for="loginByEmailLastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="loginByEmailLastName" name="lastname" aria-label="Last name">
                </div>
                <div class="col-12">
                    <label for="newUserOtpEmailReadonly" class="form-label">Email</label>
                    <input type="text" class="form-control" id="newUserOtpEmailReadonly" value="{{email}}" aria-label="Email" readonly disabled>
                    <input type="hidden" id="loginByEmailNewUserEmail" name="email" value="{{email}}">
                </div>
                <div class="col-12">
                    <label for="loginByEmailNewUserOtpInput" class="form-label">Access Code</label>
                    <input type="text" class="form-control" id="loginByEmailNewUserOtpInput" name="otp" placeholder="123456" maxlength="6" aria-label="Access Code">
                </div>
                <div class="mt-3">
                    <button onclick="submitLoginByEmailNewUserOtp()" class="btn btn-primary">Verify Code</button>
                </div>
            </div>
        </div>
        <div id="newUserOtpError" class="text-danger mt-2" style="display:none;"></div>
    </div>
</div>
<script>
    function submitLoginByEmailNewUserOtp() {
        var otp = document.getElementById('loginByEmailNewUserOtpInput').value.trim();
        var firstName = document.getElementById('loginByEmailFirstName').value.trim();
        var lastName = document.getElementById('loginByEmailLastName').value.trim();
        var email = document.getElementById('loginByEmailNewUserEmail').value;
        var formData = new FormData();
        formData.append('email', email);
        formData.append('otp', otp);
        formData.append('firstname', firstName);
        formData.append('lastname', lastName);
        $.ajax({
            url: "/SubmitLoginByEmailNewUserOtp",
            type: "POST",
            data: formData,
            contentType: false,
            processData: false
        }).done(function (response) {
            var obj = JSON.parse(response);
            if (obj.success) {
                location.reload();
            } else {
                var errorDiv = document.getElementById('newUserOtpError');
                errorDiv.textContent = obj.errorMessage;
                errorDiv.style.display = 'block';
            }
        }).fail(function () {
            alert("Error. The server couldn't be reached.");
        });
    }
</script>
</body>
</html>
