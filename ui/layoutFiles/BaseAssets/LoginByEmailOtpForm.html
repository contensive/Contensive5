<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="layout" content="Login By Email OTP Form Layout">
    <meta name="layout-guid" content="{AB098DB4-F4BE-4393-A9E7-0CBF863C0D42}">
    <title>Login By Email OTP Form Layout</title>
</head>
<body>
<style>
    .form-control::placeholder {
        color: #bbb;
    }
</style>
<div class="container-fluid">
    <div class="card card-body col-sm-10 col-md-7 col-lg-6 m-auto rounded-3 shadow-sm py-4 px-4 mt-5">
        <div class="text-center mb-4 border-bottom pb-3">
            <h1 class="fs-3">Verify Your Email</h1>
            <p class="text-muted">A one-time access code has been sent to your email. Enter the code below to continue.</p>
        </div>
        <div id="otpForm">
            <div class="mb-2">
                <label for="loginByEmailOtpInput" class="form-label">Access Code</label>
                <input type="text" class="form-control" id="loginByEmailOtpInput" name="otp" placeholder="123456" maxlength="6" aria-label="Access Code">
                <input type="hidden" id="loginByEmailOtpEmail" name="email" value="{{email}}">
            </div>
            <div class="mt-3">
                <button onclick="submitLoginByEmailOtp()" class="btn btn-primary">Verify Code</button>
            </div>
        </div>
        <div id="otpError" class="text-danger mt-2" style="display:none;"></div>
    </div>
</div>
<script>
    function submitLoginByEmailOtp() {
        var otp = document.getElementById('loginByEmailOtpInput').value.trim();
        var email = document.getElementById('loginByEmailOtpEmail').value;
        var formData = new FormData();
        formData.append('email', email);
        formData.append('otp', otp);
        $.ajax({
            url: "/SubmitLoginByEmailOtp",
            type: "POST",
            data: formData,
            contentType: false,
            processData: false
        }).done(function (response) {
            var obj = JSON.parse(response);
            if (obj.success) {
                location.reload();
            } else {
                var errorDiv = document.getElementById('otpError');
                errorDiv.textContent = obj.errorMessage;
                errorDiv.style.display = 'block';
            }
        }).fail(function () {
            alert("Error. The server couldn't be reached.");
        });
    }
</script>
</body>
</html>
