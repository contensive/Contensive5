<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login By Email</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" data-delete rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <meta name="layout" content="Login By Email Form Layout">
</head>

<body>

  <div class="container-fluid">
    <div class="card card-body col-sm-10 col-md-7 col-lg-6 m-auto rounded-3 shadow-sm py-4 px-4 mt-5">
      <div class="text-center mb-5 border-bottom pb-3">
        <h1 class="fs-3">Enter Your Email to Access This Page</h1>
      </div>
      <div id="emailForm">
        <div class="mb-2">
          <label for="loginByEmailInput" class="form-label">Email</label>
          <input type="email" class="form-control" id="loginByEmailInput" placeholder="you@example.com" aria-label="Email" required>
          <div id="emailError" class="text-danger mt-1" style="display:none;">Please enter a valid email address.</div>
        </div>
        <div class="mt-3">
          <button onclick="submitLoginByEmail()" class="btn btn-primary">Submit</button>
        </div>
      </div>
      <div id="otpForm" style="display:none;">
        <div class="mb-2">
          <p>A one-time access code has been sent to <b id="otpEmailDisplay"></b>. Check your email and enter the code below.</p>
          <label for="loginByEmailOtpInput" class="form-label">Access Code</label>
          <input type="text" class="form-control" id="loginByEmailOtpInput" placeholder="123456" maxlength="6" aria-label="Access Code">
        </div>
        <div class="mt-3">
          <button onclick="submitLoginByEmailOtp()" class="btn btn-primary">Verify Code</button>
        </div>
      </div>
      <div id="newUserOtpForm" style="display:none;">
        <div class="mb-2">
          <p>A one-time access code has been sent to <b id="newUserOtpEmailDisplay"></b>. Check your email and enter the code below.</p>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="loginByEmailFirstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="loginByEmailFirstName" aria-label="First name">
          </div>
          <div class="col-md-6">
            <label for="loginByEmailLastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="loginByEmailLastName" aria-label="Last name">
          </div>
          <div class="col-12">
            <label for="newUserOtpEmailReadonly" class="form-label">Email</label>
            <input type="text" class="form-control" id="newUserOtpEmailReadonly" aria-label="Email" readonly disabled>
          </div>
          <div class="col-12">
            <label for="loginByEmailNewUserOtpInput" class="form-label">Access Code</label>
            <input type="text" class="form-control" id="loginByEmailNewUserOtpInput" placeholder="123456" maxlength="6" aria-label="Access Code">
          </div>
          <div class="mt-3">
            <button onclick="submitLoginByEmailNewUserOtp()" class="btn btn-primary">Verify Code</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var loginByEmailAddress = '';

    function isValidEmail(email) {
      var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    function submitLoginByEmail() {
      var email = document.getElementById('loginByEmailInput').value.trim();
      var errorDiv = document.getElementById('emailError');
      if (!isValidEmail(email)) {
        errorDiv.style.display = 'block';
        return;
      }
      errorDiv.style.display = 'none';
      loginByEmailAddress = email;
      var formData = new FormData();
      formData.append('email', email);
      $.ajax({
        url: "/SubmitLoginByEmailRequest",
        type: "POST",
        data: formData,
        contentType: false,
        processData: false
      }).done(function (response) {
        var obj = JSON.parse(response);
        if (obj.success) {
          document.getElementById('emailForm').style.display = 'none';
          if (obj.isNewUser) {
            document.getElementById('newUserOtpEmailDisplay').textContent = email;
            document.getElementById('newUserOtpEmailReadonly').value = email;
            document.getElementById('newUserOtpForm').style.display = 'block';
          } else {
            document.getElementById('otpEmailDisplay').textContent = email;
            document.getElementById('otpForm').style.display = 'block';
          }
        } else {
          alert(obj.errorMessage);
        }
      }).fail(function () {
        alert("Error. The server couldn't be reached.");
      });
    }

    function submitLoginByEmailOtp() {
      var otp = document.getElementById('loginByEmailOtpInput').value.trim();
      var formData = new FormData();
      formData.append('email', loginByEmailAddress);
      formData.append('otp', otp);
      $.ajax({
        url: "/SubmitLoginByEmailOtp",
        type: "POST",
        data: formData,
        contentType: false,
        processData: false
      }).done(function (response) {
        var obj = JSON.parse(response);
        if (obj.success) {
          location.reload();
        } else {
          alert(obj.errorMessage);
        }
      }).fail(function () {
        alert("Error. The server couldn't be reached.");
      });
    }

    function submitLoginByEmailNewUserOtp() {
      var otp = document.getElementById('loginByEmailNewUserOtpInput').value.trim();
      var firstName = document.getElementById('loginByEmailFirstName').value.trim();
      var lastName = document.getElementById('loginByEmailLastName').value.trim();
      var formData = new FormData();
      formData.append('email', loginByEmailAddress);
      formData.append('otp', otp);
      formData.append('firstname', firstName);
      formData.append('lastname', lastName);
      $.ajax({
        url: "/SubmitLoginByEmailNewUserOtp",
        type: "POST",
        data: formData,
        contentType: false,
        processData: false
      }).done(function (response) {
        var obj = JSON.parse(response);
        if (obj.success) {
          location.reload();
        } else {
          alert(obj.errorMessage);
        }
      }).fail(function () {
        alert("Error. The server couldn't be reached.");
      });
    }
  </script>

</body>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</html>
