<style>
.otp-floating-label-group {
    position: relative;
    margin-top: 1rem;
    padding-top: 0.5rem;
}

.otp-floating-label-group label {
    position: absolute;
    left: 0.75rem;
    top: 1.25rem;
    color: #6c757d;
    font-size: 1rem;
    transition: all 0.2s ease;
    pointer-events: none;
    background-color: white;
    padding: 0 0.25rem;
}

.otp-floating-label-group input {
    padding: 0.75rem;
}

.otp-floating-label-group input:focus + label,
.otp-floating-label-group input.has-value + label {
    top: -0.5rem;
    font-size: 0.875rem;
    color: #198754;
}

.otp-floating-label-group input:focus {
    outline: none;
    border-color: #198754;
    box-shadow: 0 0 0 0.25rem rgba(25, 135, 80, 0.25);
}
</style>

<div class="p-4 pt-0 container-fluid">
    <h4 class="mt-0">Enter Your Access Code</h4>
	{{#userError}}<div class="alert alert-danger" role="alert">{{{userError}}}</div>{{/userError}}
	<p class="text-muted">A one-time access code has been sent to <b>{{otpEmail}}</b>. Enter the code below.</p>
	<div class="otp-floating-label-group">
		<input type="text" name="otp" id="otpInputCode" class="form-control" maxlength="6" required autofocus>
		<label for="otpInputCode">Access Code</label>
	</div>
	<input type="hidden" name="email" value="{{otpEmail}}">
	<div class="pt-2 d-grid">
		<button class="btn btn-success btn-block" type="submit">Verify Code</button>
	</div>
	<div class="pt-2 text-center">
		<a href="?" class="text-muted">Back to Login</a>
	</div>
</div>

<script>
(function() {
    function updateLabelState(input) {
        if (input.value.trim() !== '') {
            input.classList.add('has-value');
        } else {
            input.classList.remove('has-value');
        }
    }

    var inputs = document.querySelectorAll('.otp-floating-label-group input');

    inputs.forEach(function(input) {
        updateLabelState(input);

        input.addEventListener('input', function() {
            updateLabelState(this);
        });

        input.addEventListener('blur', function() {
            updateLabelState(this);
        });
    });

    window.addEventListener('load', function() {
        inputs.forEach(function(input) {
            updateLabelState(input);
        });
    });
})();
</script>
