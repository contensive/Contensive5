# repo-catalog.yml
# Stable metadata for all repos that participate in the monthly Contensive release.
# This file is the source of truth for tier assignments, package production/consumption,
# and exclusions. new-release.ps1 reads this to generate a fresh release-manifest.yml.
#
# Tier definitions:
#   0 - Foundation: produces core packages (CPBaseClass, DbModels, Processor)
#   1 - Shared libraries: produces packages consumed by other addons
#   2 - Leaf addons with C# code: consumes packages but produces none others depend on
#   3 - Data/UI-only collections: no C# build, just collection XML and assets
#
# Optional per-repo field:
#   e2e_path - optional; folder (relative to path) holding a Playwright suite. When set, the release runs the e2e step for this repo.

repos:
  # ==========================================================================
  # TIER 0 - Foundation
  # ==========================================================================
  - name: Contensive5
    path: C:\Git\Contensive5
    tier: 0
    produces:
      - Contensive.CPBaseClass
      - Contensive.DbModels
      - Contensive.Processor
    depends_on: []

  # ==========================================================================
  # TIER 1 - Shared Libraries (build in this order)
  # ==========================================================================
  - name: aoMCP
    path: C:\Git\aoMCP
    tier: 1
    produces:
      - Contensive.Addons.Mcp.Shared
    depends_on:
      - Contensive.CPBaseClass
      - Contensive.DbModels

  - name: aoCrm
    path: C:\Git\aoCrm
    tier: 1
    produces:
      - Contensive.CRM
    depends_on:
      - Contensive.CPBaseClass
      - Contensive.DbModels
      - Contensive.Processor
      - Contensive.Addons.Mcp.Shared

  - name: aoDesignBlocks
    path: C:\Git\aoDesignBlocks
    tier: 1
    produces:
      - Contensive.DesignBlockBase
    depends_on:
      - Contensive.CPBaseClass
      - Contensive.DbModels
      - Contensive.CRM
      - Contensive.Addons.Mcp.Shared

  - name: aoEcommerce
    path: C:\Git\aoEcommerce
    tier: 1
    e2e_path: tests/e2e
    produces:
      - Contensive.EcommerceApi
    depends_on:
      - Contensive.CPBaseClass
      - Contensive.DbModels
      - Contensive.DesignBlockBase

